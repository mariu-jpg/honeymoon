]}
];
const ACC=["#ee5a36","#2ba39d","#e8548c","#8cc63f","#f2c230","#3d8fd1"];
const ON=["#fff","#fff","#fff","#484848","#484848","#fff"];
const P={
plane:'<path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/>',
land:'<path d="M17.8 17.2 16 9l3.5-3.5C21 4 21.5 2 21 1c-1-.5-3 0-4.5 1.5L13 6 4.8 4.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 10l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z" transform="translate(0 -1)"/><path d="M3 22.5h18"/>',
train:'<path d="M6 3h12a2 2 0 0 1 2 2v11a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3V5a2 2 0 0 1 2-2z"/><path d="M4 11h16M8 19l-2 3M16 19l2 3"/><circle cx="8.5" cy="15" r=".8"/><circle cx="15.5" cy="15" r=".8"/>',
bus:'<path d="M5 3h14a2 2 0 0 1 2 2v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a2 2 0 0 1 2-2z"/><path d="M3 11h18M6.5 18v2.5M17.5 18v2.5"/><circle cx="7.5" cy="14.5" r=".8"/><circle cx="16.5" cy="14.5" r=".8"/>',
car:'<path d="M4 17v-5l2-5h12l2 5v5M3 17h18M5 12h14"/><circle cx="8" cy="17" r="1.3"/><circle cx="16" cy="17" r="1.3"/>',
bag:'<path d="M7 7h10a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2zM9 7V4h6v3M9 11v6M15 11v6"/>',
fork:'<path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 21V3c-3 1-4 5-4 9h4"/>',

beer:'<path d="M6 7h9v13a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1zM15 10h2.500a1.5 1.5 0 0 1 1.5 1.500v3a1.5 1.5 0 0 1-1.5 1.500H15M6 7c0-2 2-3 4-2 1-1.5 4-1 5 2"/>',

spa:'<path d="M4 19c2-2 3 2 5 0s3 2 5 0 3 2 6 0M8 4c-1.5 2 1.5 3 0 5M13 4c-1.5 2 1.5 3 0 5M18 4c-1.5 2 1.5 3 0 5"/>',
shirt:'<path d="M8 3 3 7l3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 0 1-8 0z"/>',
home:'<path d="M3 11 12 3l9 8v10H3zM9 21v-6h6v6"/>',
pin:'<path d="M12 21s-7-6-7-11a7 7 0 0 1 14 0c0 5-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/>',
link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.700l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.700l1-1"/>',
tel:'<path d="M5 4h4l2 5-2.5 1.500a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
warn:'<path d="M12 3 22 20H2z"/><path d="M12 10v4.500M12 17.200v.1"/>',

prev:'<path d="m15 5-7 7 7 7"/>',next:'<path d="m9 5 7 7-7 7"/>',
theme:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.500a8.5 8.5 0 0 0 0 17z" fill="currentColor"/>'};
const IC={"✈":"plane","🛬":"land","🍛":"bowl","🚃":"train","🚄":"train","🚉":"train","🚌":"bus","🚕":"car","🧳":"bag","📸":"cam","🍖":"fork","🍽":"fork","🍣":"bowl","🦀":"bowl","🍶":"beer","🏨":"bed","♨":"spa","🧺":"shirt","🎐":"cam","🌋":"mtn","🛍":"shop","🏠":"home"};
const svg=k=>'<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+P[k]+'</svg>';
const ico=e=>svg(IC[e.replace(/\uFE0F/g,"")]||"pin");
const W=["日","月","火","水","木","金","土"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const mq=q=>"https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const dd=s=>{const[a,b,c]=s.split("-").map(Number);return new Date(a,b-1,c)};
let cur=0;
$("prev").innerHTML=svg("prev");$("next").innerHTML=svg("next");$("tgl").innerHTML=svg("theme");

function defaultDay(){
  const t=ymd(new Date()),i=DAYS.findIndex(x=>x.d===t);
  if(i>=0)return i;
  return t<DAYS[0].d?0:DAYS.length-1;
}
function tick(){
  const n=new Date();
  $("clk").textContent=pad(n.getHours())+":"+pad(n.getMinutes());
  $("dt").innerHTML=n.getFullYear()+"年<br>"+(n.getMonth()+1)+"月"+n.getDate()+"日（"+W[n.getDay()]+"）";
  const t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),s=dd(DAYS[0].d),e=dd(DAYS[DAYS.length-1].d);
  const diff=Math.round((s-t0)/864e5);
  $("cd").textContent=diff>0?"出発まであと "+diff+" 日！":(t0<=e?"旅行中！ 楽しんで":"おかえりなさい");
  if(ymd(n)===DAYS[cur].d)render(true);
}
function btn(c,k,l,u){return '<a class="btn '+c+'" href="'+u+'" target="_blank" rel="noopener">'+svg(k)+l+'</a>'}
function render(keep){
  const D=DAYS[cur],dt=dd(D.d),n=new Date(),isToday=ymd(n)===D.d,nm=n.getHours()*60+n.getMinutes();
  const r=document.documentElement.style;
  r.setProperty("--accent",ACC[cur]);r.setProperty("--on",ON[cur]);
  $("dnum").textContent="DAY "+(cur+1);
  $("dlab").textContent=(dt.getMonth()+1)+"/"+dt.getDate()+"（"+W[dt.getDay()]+"）"+(isToday?"・今日":"");
  $("route").textContent=D.route;
  $("prev").disabled=cur===0;$("next").disabled=cur===DAYS.length-1;
  $("dots").innerHTML=DAYS.map((x,i)=>'<button class="dot'+(i===cur?" on":"")+(ymd(n)===x.d?" today":"")+'" data-i="'+i+'">'+(i+1)+'</button>').join("");
  let nowIdx=-1;
  if(isToday)D.items.forEach((x,i)=>{if(x.m!=null&&x.m<=nm)nowIdx=i});
  $("tl").innerHTML=D.items.map((x,i)=>{
    let b="";
    if(x.map)b+=btn("map","pin","マップ",mq(x.map));
    if(x.web)b+=btn("web","link","公式サイト",x.web);
    if(x.ty==="hotel"&&x.tel)b+='<a class="btn tel" href="tel:'+x.tel.replace(/[^0-9+]/g,"")+'">'+svg("tel")+x.tel+'</a>';
    const lab={move:"MOVE",eat:"GOURMET",sight:"SPOT",hotel:"HOTEL",todo:"MEMO"}[x.ty];
    const cls=(i===nowIdx?" now":"")+(nowIdx>=0&&i<nowIdx?" past":"");
    return '<div class="it t-'+x.ty+cls+'"><div class="tm"><i>'+ico(x.ic)+'</i><b>'+x.t+'</b></div><div class="cd2"><span class="tag">'+lab+'</span><h3>'+x.h+'</h3>'
      +(x.n?'<p>'+x.n+'</p>':'')+(x.pat?'<div class="pat">'+x.pat.map(p=>'<div class="pr"><span class="pl">'+p[0]+'</span><div><span>'+p[1]+'</span><span>'+p[2]+'</span></div></div>').join('')+'</div>':'')+(x.w?'<p class="warn">'+svg("warn")+'<span>'+x.w+'</span></p>':'')
      +(x.rec?'<div class="rec"><b>'+svg("star")+'おすすめ</b>'+x.rec.map(r=>'<div class="ri"><div><strong>'+r[0]+'</strong><small>'+r[1]+'</small></div>'+btn("map","pin","",mq(r[2]||r[0]))+'</div>').join("")+'</div>':'')
      +(b?'<div class="btns">'+b+'</div>':'')+'</div></div>';
  }).join("");
  if(!keep)window.scrollTo({top:0,behavior:"smooth"});
}
function go(i){if(i<0||i>=DAYS.length)return;cur=i;render()}
$("prev").onclick=()=>go(cur-1);
$("next").onclick=()=>go(cur+1);
$("dots").onclick=e=>{const i=e.target.dataset.i;if(i!=null)go(+i)};
let sx=0;
document.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>80)go(cur+(d<0?1:-1))},{passive:true});
$("tgl").onclick=()=>{const r=document.documentElement,dark=r.dataset.theme?r.dataset.theme==="dark":matchMedia("(prefers-color-scheme:dark)").matches;r.dataset.theme=dark?"light":"dark"};
cur=defaultDay();render(true);tick();setInterval(tick,30000);
</script>
